<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frostbite Antigravity - Atari Style</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <div id="hud">
            <div class="stat">PONTOS: <span id="score">000000</span></div>
            <div class="stat">TEMP: <span id="temp">45</span>°</div>
            <div class="stat">VIDAS: <span id="lives">3</span></div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="overlay" class="hidden">
            <h1 id="overlay-title">FROSTBITE</h1>
            <p id="overlay-msg">PRESSIONE ESPAÇO PARA COMEÇAR</p>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
